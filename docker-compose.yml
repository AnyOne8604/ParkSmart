# Entorno local completo: PostgreSQL/PostGIS, API FastAPI y pgAdmin para inspección (pgAdmin agregado en v0.3.0).
services:
  # Base relacional con extensión espacial; volumen persistente conserva usuarios/reportes entre reinicios.
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: parksmart
      POSTGRES_USER: parksmart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parksmart-local}
    ports:
      - "5432:5432"
    volumes:
      - parksmart_db:/var/lib/postgresql/data
    # API espera a que PostgreSQL acepte conexiones antes de aplicar migraciones e iniciar Uvicorn.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parksmart -d parksmart"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend REST; ADMIN_* crea/sincroniza al administrador al arrancar y secretos vienen del .env local.
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://parksmart:${POSTGRES_PASSWORD:-parksmart-local}@db:5432/parksmart
      JWT_SECRET: ${JWT_SECRET:-replace-this-secret-before-sharing}
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      ADMIN_NAME: ${ADMIN_NAME:-Carlos Ramírez}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-movilidad@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the ignored .env file}
    ports:
      - "8000:8000"
    # Evidencia fotográfica vive fuera del contenedor en un volumen privado persistente.
    volumes:
      - parksmart_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Consola web de administración DB publicada solo en localhost, no en la red externa.
  pgadmin:
    image: dpage/pgadmin4:9.10
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@parksmart.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-parksmart-local-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - parksmart_pgadmin:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

# Volúmenes nombrados separan los datos de BD, fotos y configuración de pgAdmin.
volumes:
  parksmart_db:
  parksmart_uploads:
  parksmart_pgadmin:
